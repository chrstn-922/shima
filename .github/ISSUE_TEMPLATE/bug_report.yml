name: Bug Report
description: Report a crash, visual glitch, or unexpected behavior in Shima
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue with Shima! Please fill out the details below so we can reproduce and investigate quickly.
  - type: input
    id: shima_version
    attributes:
      label: Shima Version
      description: Version shown in Settings or the installer filename
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: windows_version
    attributes:
      label: Windows Version
      description: Run `winver` or check System > About (include build number if known)
      placeholder: e.g. Windows 11 24H2 (Build 26100)
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation Method
      options:
        - Inno Setup Installer (Shima-Setup-*.exe)
        - Portable (.zip)
        - Built from source
    validations:
      required: false
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Clear numbered steps to trigger the issue
      placeholder: |
        1. Open the expanded island...
        2. Click '...'
        3. Observe behavior
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: Describe what you expected to happen and what actually happened instead
    validations:
      required: true
  - type: textarea
    id: diagnostic_logs
    attributes:
      label: Sanitized Diagnostic Log Bundle & Screenshots
      description: |
        Open **Shima Settings → General → Diagnostic logs (sanitized) → Export bundle**, then drag and drop the exported `.zip` file here (user paths and secrets are automatically sanitized). Attach screenshots or screen recordings if helpful.
      placeholder: Drag and drop your exported diagnostic bundle .zip (and optional screenshots) here...
    validations:
      required: false
